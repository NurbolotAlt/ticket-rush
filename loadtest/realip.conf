# ТОЛЬКО для нагрузочного теста — подключается через docker-compose.loadtest.yml.
#
# Генератор нагрузки — один контейнер, для nginx все его запросы с одного IP, а
# лимиты у нас по IP. Модуль realip подменяет $remote_addr значением из
# X-Forwarded-For, но ТОЛЬКО для запросов из Docker-сети: так каждый виртуальный
# пользователь k6 становится отдельным "клиентом" со своим адресом.
#
# В проде это оставлять НЕЛЬЗЯ: любой назвался бы любым IP и обошёл все лимиты.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
