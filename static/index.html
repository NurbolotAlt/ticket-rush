<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ticket-rush</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a href="/" class="brand">ticket-rush</a>
    <span id="source" class="source" title="Откуда пришли данные схемы зала"></span>
  </header>

  <main class="page">
    <section id="events-view">
      <h1>Концерты</h1>
      <ul id="events" class="events"></ul>
    </section>

    <section id="event-view" hidden>
      <a href="#" id="back" class="back">← все концерты</a>
      <h1 id="event-title"></h1>
      <p id="event-meta" class="muted"></p>

      <div id="queue" class="queue">
        <div id="queue-text" class="queue-text"></div>
        <div class="progress" id="queue-progress" hidden><div id="queue-bar"></div></div>
        <div id="queue-meta" class="muted small"></div>
        <button id="queue-btn" type="button" hidden>Встать в очередь</button>
      </div>

      <div id="cart" class="cart" hidden>
        <div id="cart-mine"></div>
        <div id="cart-timer" class="muted small"></div>
        <div id="cart-note" class="error small"></div>
        <div class="actions">
          <button id="cart-btn" type="button" hidden>Забронировать</button>
          <button id="pay-btn" type="button" class="pay" hidden>Оплатить</button>
        </div>
      </div>

      <div id="tickets" class="tickets" hidden>
        <div class="queue-text">Билеты куплены!</div>
        <div id="tickets-meta" class="muted small"></div>
        <ul id="tickets-list"></ul>
        <div id="tickets-pdf" class="small"></div>
      </div>

      <div id="legend" class="legend"></div>
      <div id="hall" class="hall">
        <div class="stage">СЦЕНА</div>
      </div>
    </section>

    <p id="error" class="error" hidden></p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
