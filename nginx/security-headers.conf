# Подключается через include в server и в КАЖДЫЙ location, где есть свой
# add_header: в nginx add_header внутри location отменяет все add_header уровня
# server, и без повтора такие ответы уходили бы без security-заголовков.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
