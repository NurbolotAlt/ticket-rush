# ============================================================
# nginx для ticket-rush: TLS, статика, reverse proxy к API.
# Основа — конфиг проекта compute-service; кэширование каталога,
# WebSocket и лимиты добавляются на следующих этапах.
# ============================================================

upstream api {
    # least_conn: запросы разные по длительности, отправляем туда, где меньше
    # активных соединений. zone — счётчики в общей памяти всех worker'ов nginx
    # (без неё у каждого worker'а своя картина, и балансировка перекашивается).
    least_conn;
    zone api_upstream 64k;
    # resolve: nginx перечитывает адреса реплик через Docker DNS по ходу работы —
    # новые и пересозданные реплики подхватываются без перезапуска nginx.
    # max_fails=3 fail_timeout=5s: реплика выключается после 3 ошибок за 5 с,
    # а не после одной (по умолчанию) — случайный обрыв не выключает живую реплику.
    server api:8000 resolve max_fails=3 fail_timeout=5s;
    # Постоянные соединения к API вместо нового TCP на каждый запрос. Закрывает
    # простаивающие nginx (60 с) раньше, чем gunicorn (--keep-alive 75), —
    # иначе редкие 502 на соединении, которое backend как раз закрывает.
    keepalive 32;
    keepalive_timeout 60s;
}

# Docker DNS; перечитывать адреса реплик раз в 5 с.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

# $request_id — случайный id, который nginx генерирует на каждый запрос. Он же
# уходит в API (X-Request-ID) и попадает в каждую строку JSON-логов приложения:
# по одному id видна вся история запроса. $upstream_addr — какая реплика ответила.
log_format main_ext '$remote_addr [$time_local] "$request" $status '
                    'rid=$request_id upstream=$upstream_addr '
                    'rt=$request_time uprt=$upstream_response_time';

server {
    listen 80;
    server_name _;

    # Для Docker healthcheck — до редиректа на HTTPS.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # TLS termination: снаружи трафик зашифрован до nginx, дальше по приватной
    # Docker-сети до API идёт обычный HTTP.
    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/access.log main_ext;

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 256;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- Статика: напрямую с диска, API не участвует ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API ---
    location /api/ {
        client_max_body_size 4k;

        proxy_pass http://api;
        # keepalive к upstream работает только по HTTP/1.1 и без "Connection: close".
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # X-Real-IP и X-Request-ID ПЕРЕЗАПИСЫВАЮТСЯ nginx: присланные клиентом
        # значения до API не доходят, поэтому API может им доверять.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
