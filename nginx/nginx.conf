# ============================================================
# nginx для ticket-rush: TLS, статика, reverse proxy к API.
# Основа — конфиг проекта compute-service; кэширование каталога,
# WebSocket и лимиты добавляются на следующих этапах.
# ============================================================

upstream api {
    # least_conn: запросы разные по длительности, отправляем туда, где меньше
    # активных соединений. zone — счётчики в общей памяти всех worker'ов nginx
    # (без неё у каждого worker'а своя картина, и балансировка перекашивается).
    least_conn;
    zone api_upstream 64k;
    # resolve: nginx перечитывает адреса реплик через Docker DNS по ходу работы —
    # новые и пересозданные реплики подхватываются без перезапуска nginx.
    # max_fails=3 fail_timeout=5s: реплика выключается после 3 ошибок за 5 с,
    # а не после одной (по умолчанию) — случайный обрыв не выключает живую реплику.
    server api:8000 resolve max_fails=3 fail_timeout=5s;
    # Постоянные соединения к API вместо нового TCP на каждый запрос. Закрывает
    # простаивающие nginx (60 с) раньше, чем gunicorn (--keep-alive 75), —
    # иначе редкие 502 на соединении, которое backend как раз закрывает.
    keepalive 32;
    keepalive_timeout 60s;
}

# Docker DNS; перечитывать адреса реплик раз в 5 с.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

# $request_id — случайный id, который nginx генерирует на каждый запрос. Он же
# уходит в API (X-Request-ID) и попадает в каждую строку JSON-логов приложения:
# по одному id видна вся история запроса. $upstream_addr — какая реплика ответила
# ("-", если ответ из кэша), cache= — HIT/MISS/STALE/UPDATING/EXPIRED.
log_format main_ext '$remote_addr [$time_local] "$request" $status '
                    'rid=$request_id cache=$upstream_cache_status '
                    'upstream=$upstream_addr '
                    'rt=$request_time uprt=$upstream_response_time';

# --- Кэш ответов API (каталог и схема зала) ---
# Хранится на диске контейнера (горячие записи ОС держит в page cache, т.е. в
# памяти); ключи и метаданные — в общей памяти keys_zone для всех worker'ов.
# max_size — потолок на диске; inactive=10m — запись, которую никто не спрашивал
# 10 минут, удаляется, даже если её срок годности давно истёк. Именно до этого
# момента nginx может отдать её как STALE, если API лежит.
# use_temp_path=off — ответ пишется сразу в каталог кэша, без копирования из temp.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                 max_size=100m inactive=10m use_temp_path=off;

server {
    listen 80;
    server_name _;

    # Для Docker healthcheck — до редиректа на HTTPS.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # TLS termination: снаружи трафик зашифрован до nginx, дальше по приватной
    # Docker-сети до API идёт обычный HTTP.
    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/access.log main_ext;

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 256;

    include /etc/nginx/snippets/security-headers.conf;

    # --- Статика: напрямую с диска, API не участвует ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Каталог: концерты и схема зала, из кэша ---
    # Одинаковые для всех данные: при открытии продаж тысячи запросов в секунду
    # просят одну и ту же схему зала. Кэш превращает их в ~1 запрос к API в
    # секунду на каждый концерт — независимо от числа зрителей.
    location /api/events {
        proxy_cache api_cache;
        # Срок жизни задаёт API заголовком Cache-Control (каталог 5 с, схема 1 с) —
        # только оно знает, насколько данные могут устареть. Ответы с Set-Cookie
        # nginx по умолчанию не кэширует — чужая сессия не утечёт из кэша.

        # proxy_cache_lock — защита от cache stampede на уровне nginx (аналог
        # distributed lock из compute-service, только для чтения): при промахе
        # в API идёт ОДИН запрос на ключ, остальные ждут его ответ до 5 с.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        # Когда запись устарела: одному запросу обновление (в фоне), всем
        # остальным сразу старая версия (updating). Если API лежит или отвечает
        # 5xx — тоже отдаём последнюю сохранённую версию: каталог и схема зала
        # остаются видны даже при падении backend.
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        # Видно в ответе, откуда он: HIT (кэш), MISS (API), STALE, UPDATING...
        add_header X-Cache-Status $upstream_cache_status always;
        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # --- Остальной API: без кэша ---
    location /api/ {
        client_max_body_size 4k;

        proxy_pass http://api;
        # keepalive к upstream работает только по HTTP/1.1 и без "Connection: close".
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # X-Real-IP и X-Request-ID ПЕРЕЗАПИСЫВАЮТСЯ nginx: присланные клиентом
        # значения до API не доходят, поэтому API может им доверять.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
